<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Join the team · FleetLog</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f3f4f9;color:#1d1f3a}header{background:linear-gradient(135deg,#5b2a86,#33184d);color:#fff;padding:22px 16px}header h1{margin:0;font-size:22px}header p{margin:5px 0 0;opacity:.88;font-size:14px}
main{max-width:460px;margin:0 auto;padding:16px}.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 10px #1a237e14}label{display:block;font-weight:700;font-size:15px;margin:14px 0 6px}input{width:100%;font-size:17px;padding:13px;border:1.5px solid #cfd2e3;border-radius:12px;font-family:inherit}
button{width:100%;font-size:18px;font-weight:700;border:0;border-radius:12px;padding:15px;margin-top:18px;background:#e8742a;color:#fff;cursor:pointer}button:disabled{opacity:.6}.seg{display:flex;background:#e6e7f0;border-radius:12px;padding:4px;gap:4px}.seg a{flex:1;text-align:center;padding:10px;border-radius:9px;font-weight:700;font-size:14px;color:#556;text-decoration:none}.seg a.on{background:#fff;color:#5b2a86}
.role{display:inline-block;background:#f2ecf8;color:#5b2a86;font-weight:700;border-radius:20px;padding:3px 12px;font-size:13px}.err{background:#fdecec;color:#a11;padding:11px;border-radius:10px;margin-top:12px;font-size:14px}.hint{font-size:12px;color:#667;margin-top:5px}</style></head>
<body><header><h1>You're invited to a fleet team</h1><p>Join to see and update the fleet's trucks and service log.</p></header><main><div class="card" id="m"><p>Loading…</p></div></main>
<script>
const T = location.pathname.split('/')[2] || '', $ = s => document.querySelector(s), esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let I = null, mode = 'new';
async function load() { const r = await fetch('/api/invite/' + encodeURIComponent(T)); const j = await r.json().catch(() => ({})); if (!r.ok) { $('#m').innerHTML = `<div class="err">${esc(j.error || 'This invite link is not valid.')}</div>`; return; } I = j; mode = j.exists ? 'old' : 'new'; draw(); }
function draw() {
  $('#m').innerHTML = `<p style="margin:0 0 12px">Your role: <span class="role">${I.role === 'admin' ? 'Admin – full access' : 'User – trucks, service log &amp; reports'}</span></p>
  <div class="seg"><a href="#" class="${mode === 'new' ? 'on' : ''}" onclick="mode='new';draw();return false">I'm new here</a><a href="#" class="${mode === 'old' ? 'on' : ''}" onclick="mode='old';draw();return false">I have an account</a></div>
  <form id="f" autocomplete="on"><label>Email</label><input name="email" type="email" required autocomplete="email" value="${esc(I.email || '')}" ${I.email ? 'readonly' : ''}>
  <label>${mode === 'new' ? 'Create a password' : 'Your password'}</label><input name="pw" type="password" required minlength="8" autocomplete="${mode === 'new' ? 'new-password' : 'current-password'}">${mode === 'new' ? '<div class="hint">At least 8 characters.</div><label>Repeat password</label><input name="pw2" type="password" required minlength="8" autocomplete="new-password">' : ''}
  <div id="e"></div><button id="sb">${mode === 'new' ? 'Create account &amp; join' : 'Sign in &amp; join'}</button></form>`;
  $('#f').onsubmit = go;
}
async function go(e) {
  e.preventDefault(); const f = e.target, err = t => $('#e').innerHTML = `<div class="err">${esc(t)}</div>`;
  if (f.pw.value.length < 8) return err('Password must be at least 8 characters.'); if (mode === 'new' && f.pw.value !== f.pw2.value) return err('The passwords do not match.');
  const b = $('#sb'); b.disabled = true;
  const r = await fetch('/api/invite/' + encodeURIComponent(T), { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: f.email.value.trim(), password: f.pw.value }) });
  const j = await r.json().catch(() => ({})); if (!r.ok) { b.disabled = false; return err(j.error || 'Could not join. Try again.'); }
  location.href = '/';
}
load();
</script></body></html>
