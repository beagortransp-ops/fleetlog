    <h3 style="font-size:14px">Known fixes</h3>${kbFixTable(g.fixes)}
    <form onsubmit="kbAdd(${esc(JSON.stringify(g.group))},this);return false" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;margin:8px 0"><input name="symptom" placeholder="Symptom"><input name="code" placeholder="Trouble code"><input name="fix" placeholder="Fix" required><input name="parts" placeholder="Parts"><input name="labor" placeholder="Labor (e.g. 1.5 h)"><input name="notes" placeholder="Notes"><button class="b">Add fix</button></form>
    <h3 style="font-size:14px">NHTSA recalls for ${esc(g.year)} ${esc(g.make)} ${esc(g.model)} (${g.recalls.length})</h3><p style="font-size:12px;color:#667;margin-top:0">Recalls listed for this model and year. Not every recall applies to every VIN, so check each VIN on NHTSA.</p>${g.recalls.map(r => `<details style="margin:4px 0"><summary><b>${esc(r.NHTSACampaignNumber)}</b> · ${esc(r.ReportReceivedDate)} · ${esc(r.Component)}${r.parkIt ? ' <span class="tp r">PARK IT</span>' : ''}</summary><p style="font-size:13px">${esc(r.Summary)}</p><p style="font-size:13px"><b>Remedy:</b> ${esc(r.Remedy)}</p></details>`).join('')}
    <details style="margin-top:8px"><summary style="cursor:pointer;font-size:14px;font-weight:600">Bulletin summaries (${g.bulletinCount})</summary>${d.bulletins.filter(b => b.make === g.make && b.years.includes(g.year) && (b.model === g.model.toUpperCase() || (b.model === 'MT45' && /MT45/.test(g.model)))).map(b => `<div style="margin:6px 0;font-size:13px;border-bottom:1px solid #eef0f4;padding-bottom:4px"><b>${esc(b.id)}</b> <span style="color:#667">(${esc(b.years.join(', '))})</span><br>${esc(b.summary)}</div>`).join('')}</details></details>`;
  return `<div>${srch}${dtc}<div class="card"><div class="row"><h2 style="margin:0">Fleet by year and model</h2><button class="b s" onclick="kbRefresh()">Refresh recalls</button></div>${KB.msg ? `<p style="font-size:13px">${esc(KB.msg)}</p>` : ''}<p style="font-size:12px;color:#667">Sources: NHTSA recalls and manufacturer communications (public data), OBDex codes (CC0), your own service log and notes. Full Ford procedures: Motorcraft Service subscription.</p></div>${d.groups.map(grp).join('')}</div>`;
};
(async () => { try { if (!(await AUTH.current())) return signInScreen(); } catch (e) { return signInScreen(e.message); } start(); })();
async function start() { await refresh(); const h = new URLSearchParams(location.hash.slice(1));
  if (h.has('desk')) { mode = 'desk'; render(); } else if (h.has('fix')) { mode = 'desk'; tab = 'fix'; render(); }
  else if (h.has('toast')) { $('#tmsg').textContent = '✅ Brakes · T-1 · $240'; $('#toast').style.display = 'flex'; }
  else if (h.has('cat')) { qPick(+h.get('cat')); if (h.has('truck') && qs.step === 'truck') qTruck(db.vehicles[0].id); }
  else if (h.has('quick')) { mode = 'quick'; render(); }
  else if (h.has('insp')) { mode = 'quick'; iStart(); if (h.has('item') && qs.step === 'itruck') iTruck(db.vehicles[0].id); }
  else if (h.has('insptab')) { mode = 'desk'; tab = 'insp'; render(); }
  else if (h.has('mmr')) { mode = 'desk'; tab = 'mmr'; render(); }
  /*NOKBQ: kb route hidden*/
  else if (h.has('vir')) { mode = 'desk'; tab = 'vir'; render(); if (h.has('new')) virNew(db.vehicles[0].id); }
  else { mode = 'desk'; tab = 'home'; render(); } }
