services:
  - type: web
    name: fleetlog
    runtime: node
    plan: starter
    buildCommand: "true"
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeploy: false
    disk:
      name: fleetlog-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: NODE_VERSION
        value: "22"
      - key: PIN_HASH
        sync: false
      - key: OWNER_PAID
        value: "true"
      - key: OWNER_EMAIL
        sync: false
      - key: PAYMENT_URL
        sync: false
      - key: SHEETSYNC_PAYMENT_URL
        sync: false
